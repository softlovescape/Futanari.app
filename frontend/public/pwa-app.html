<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futanari Lovescape</title>
    <link rel="icon" href="/app-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        #app-frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #137333, #34a853);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: Arial, sans-serif;
        }
        
        .loading img {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        
        .loading h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <img src="/app-icon.png" alt="App Icon">
        <h1>Futanari Lovescape</h1>
        <p>Loading...</p>
        <div class="spinner"></div>
    </div>
    
    <iframe 
        id="app-frame" 
        src="https://futanari.app/" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>
    
    <script>
        // Hide loading screen when iframe loads
        const iframe = document.getElementById('app-frame');
        const loading = document.getElementById('loading');
        
        iframe.onload = function() {
            loading.style.display = 'none';
        };
        
        // Fallback: hide loading after 5 seconds regardless
        setTimeout(function() {
            loading.style.display = 'none';
        }, 5000);
        
        // Handle iframe errors
        iframe.onerror = function() {
            loading.innerHTML = `
                <img src="/app-icon.png" alt="App Icon" style="width: 80px; height: 80px; border-radius: 16px; margin-bottom: 20px;">
                <h1>Futanari Lovescape</h1>
                <p>Tap the button below to open the app:</p>
                <a href="https://futanari.app/" target="_blank" style="background: white; color: #137333; padding: 15px 30px; text-decoration: none; border-radius: 12px; font-weight: bold; margin-top: 20px; display: inline-block;">Open App</a>
            `;
        };
    </script>
</body>
</html>
